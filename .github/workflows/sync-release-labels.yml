name: sync-release-labels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-release-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync-release-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Ensure release labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'release:major', color: 'B60205', description: 'Release bump: next major version' },
              { name: 'release:minor', color: 'FBCA04', description: 'Release bump: next minor version' },
              { name: 'release:patch', color: '0E8A16', description: 'Release bump: next patch version' },
              { name: 'release:none', color: '6E7781', description: 'No release bump required' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
